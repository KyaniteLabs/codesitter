[project]
name = "fl4write"
version = "0.3.0"
description = "Self-hosted multi-forge code review bot - the org's CodeRabbit replacement."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.5", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.15"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
